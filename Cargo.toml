[package]
name = "fortiva"
version = "0.1.0"
edition = "2021"
description = "Fortiva - iOS sideload tool (Rust port)"
license = "MIT"

[lib]
name = "fortiva"
path = "src/lib.rs"

[[bin]]
name = "fortiva"
path = "src/main.rs"

[dependencies]
# HTTP + JSON
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Plist
plist = "1.10"

# Crypto (auth)
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
rsa = "0.9"
x509-certificate = "0.23"

# OpenSSL (CSR + P12)
openssl = { version = "0.10", features = ["vendored"] }

# Codesign
apple-codesign = "0.29"
p12-keystore = "0.3"

# Archive
zip = "2"

# Device
idevice = { version = "0.1.68", features = [
    "house_arrest",
    "afc",
    "usbmuxd",
    "lockdown",
    "installation_proxy",
] }
tokio = { version = "1", features = ["full"] }
# Misc
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
anyhow = "1"
thiserror = "1"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

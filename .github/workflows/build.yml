name: Build Fortiva

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android
          - target: armv7-linux-androideabi
            name: android-armv7
            artifact: fortiva-android-armv7
            ndk_target: armeabi-v7a
            cross: true
          - target: aarch64-linux-android
            name: android-arm64
            artifact: fortiva-android-arm64
            ndk_target: arm64-v8a
            cross: true

          # Linux
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            artifact: fortiva-linux-x86_64
            cross: false
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            artifact: fortiva-linux-arm64
            cross: true

          # macOS
          - target: x86_64-apple-darwin
            name: macos-x86_64
            artifact: fortiva-macos-x86_64
            cross: false
          - target: aarch64-apple-darwin
            name: macos-arm64
            artifact: fortiva-macos-arm64
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system deps (Linux)
        if: contains(matrix.target, 'linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup cross-linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV

      - name: Install cargo-ndk (Android)
        if: matrix.cross && contains(matrix.target, 'android')
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Build (Android)
        if: contains(matrix.target, 'android')
        run: |
          cargo ndk \
            -t ${{ matrix.ndk_target }} \
            -o ./jniLibs \
            build --release \
            --target ${{ matrix.target }} \
            --no-default-features

      - name: Build (others)
        if: ${{ !contains(matrix.target, 'android') }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            *android*)
              cp target/${{ matrix.target }}/release/fortiva dist/fortiva 2>/dev/null || \
              cp jniLibs/${{ matrix.ndk_target }}/fortiva dist/fortiva
              ;;
            *)
              cp target/${{ matrix.target }}/release/fortiva dist/fortiva
              ;;
          esac
          chmod +x dist/fortiva
          file dist/fortiva
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/fortiva
          if-no-files-found: error

  # Tạo release khi push tag
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir/fortiva" "release/$name"
            chmod +x "release/$name"
          done
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
